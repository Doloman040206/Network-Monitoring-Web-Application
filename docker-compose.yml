services:
  web:
    build: ./app
    container_name: network-monitor-web
    ports:
      - "5000:5000"
    environment:
      APP_NAME: "Network Monitoring Demo"
      DB_HOST: app-db
      DB_PORT: "5432"
      DB_NAME: network_monitor
      DB_USER: monitor_user
      DB_PASSWORD: ${APP_DB_PASSWORD:-monitor_dev_password_change_me}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - monitoring_net
    restart: unless-stopped

  app-db:
    image: postgres:16-alpine
    container_name: network-monitor-postgres
    environment:
      POSTGRES_DB: network_monitor
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-monitor_dev_password_change_me}
    ports:
      - "5433:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - monitoring_net
    restart: unless-stopped

  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-postgres
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_db_password}
      POSTGRES_DB: zabbix
    volumes:
      - zabbix_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - monitoring_net
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.0-alpine-latest
    container_name: zabbix-server
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_db_password}
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"
    networks:
      - monitoring_net
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:7.0-alpine-latest
    container_name: zabbix-web
    depends_on:
      - zabbix-server
      - zabbix-db
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_db_password}
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Kiev
    ports:
      - "8080:8080"
    networks:
      - monitoring_net
    restart: unless-stopped

  zabbix-agent:
    image: zabbix/zabbix-agent2:7.0-alpine-latest
    container_name: zabbix-agent
    depends_on:
      - zabbix-server
    environment:
      ZBX_HOSTNAME: "Docker Zabbix agent"
      ZBX_SERVER_HOST: zabbix-server
    networks:
      - monitoring_net
    restart: unless-stopped

volumes:
  app_db_data:
  zabbix_db_data:

networks:
  monitoring_net:
    driver: bridge